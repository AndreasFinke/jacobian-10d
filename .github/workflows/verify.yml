name: exact verification

on:
  push:
  pull_request:

jobs:
  sympy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python verify_all.py
      - run: python verify_cubic_homogeneous18.py --output cubic_homogeneous18.json
